name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to commits, not tags: the deploy job holds the
# Cloudflare token, and a tag can be moved to code nobody here has read.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci .
      - name: Unit tests
        run: pnpm run test
      # Build first: it generates apps/web/src/routeTree.gen.ts, which is
      # gitignored and required by the typecheck.
      - name: Build
        run: pnpm --filter web build
      - name: Typecheck
        run: pnpm run check-types
      # Every template at every print layout, through the same PDF code the
      # browser runs. The tests check the layout; this checks it still
      # becomes a PDF.
      - name: Render designs to PDF
        run: pnpm --filter web exec tsx scripts/render-design-samples.ts "$RUNNER_TEMP/designs"

  deploy:
    name: Migrate D1 and deploy Worker
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rsvp.botch.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter web build
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: d1 migrations apply DB --remote
      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: deploy
